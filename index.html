<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Gorjeta</title>
</head>
<body>
    <header>
        <img src="./image/logo.svg" alt="logo do splitter">
    </header>

    <main>
         <section class="informacoes">
            <form action="">
                <div class="conta">
                    <label for="">Conta</label>
                    <div>
                        <img src="./image/icon-dollar.svg" alt="icone do ccifrão">
                        <input type="number" name="ccconta" id="conta">
                    </div>
                </div>
                
                <div class="gorjeta">
                    <label for="outra">Selecione a gorjeta %</label>

                    <div>
                        <input type="button" value="5%">
                        <input type="button" value="10%">
                        <input type="button" value="15%">
                        <input type="button" value="25%">
                        <input type="button" value="50%">
                        <input type="button" name="outra" id="outra">
                    </div>
                </div>

                <div class="pessoas">                    
                    <label for="cconta">Quantidade de Pessoas</label>
                    <p>Nãop ode se zero</p>
                    <div>
                        <img src="./image/icon-person.svg" alt="icone da pessoa">
                        <input type="number" name="ccconta" id="conta">
                    </div>
                </div>
            </form>
         </section>
    </main>
</body>
</html>
